<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الجدول الدراسي</title>
    
    <style>
        :root {
            --bg: #0d1117;
            --card-bg: #161b22;
            --border: #30363d;
            --text: #e6edf3;
            --accent: #58a6ff;
            --success: #238636;
            --muted: #8b949e;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        .header-actions {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
        }

        h2 { margin: 0; display: flex; align-items: center; gap: 10px; font-size: 1.8rem; }

        /* زر التقويم */
        .btn-add { 
            background: rgba(35, 134, 54, 0.1);
            color: var(--success); 
            border: 1px solid var(--border); 
            font-size: 0.8rem; 
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }
        .btn-add:hover { 
            background: rgba(35, 134, 54, 0.2); 
            border-color: var(--success); 
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }

        th {
            background: #21262d;
            padding: 15px;
            text-align: right;
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 15px;
            border-bottom: 1px solid var(--border);
            vertical-align: top;
        }

        tr:last-child td { border-bottom: none; }

        .day-col {
            width: 120px;
            font-weight: bold;
            color: var(--accent);
            background: rgba(255,255,255,0.02);
            border-left: 1px solid var(--border);
            text-align: center;
            vertical-align: middle;
        }

        .date-sub {
            font-size: 0.75rem; 
            color: var(--muted); 
            margin-bottom: 10px; 
            font-family: monospace;
            direction: ltr;
        }

        .lecture-item {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 6px;
            border-right: 3px solid transparent;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative; /* مهم لتموضع العناصر */
            transition: 0.3s;
        }

        /* تنسيق المحاضرة المنتهية */
        .lecture-past {
            opacity: 0.5; /* شفافية */
            filter: grayscale(1); /* تحويل لأبيض وأسود */
            background: #090c10; /* خلفية أغمق */
            border-color: #21262d;
            border-right-color: #30363d !important; /* إلغاء لون المادة */
        }

        /* شارة "انتهت" */
        .ended-badge {
            background: #21262d;
            color: #8b949e;
            border: 1px solid #30363d;
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .lecture-info h4 { margin: 0 0 8px 0; font-size: 1rem; }
        
        .lecture-meta { 
            font-size: 0.85rem; 
            color: var(--muted); 
            display: flex; 
            flex-wrap: wrap;
            gap: 15px; 
        }

        .meta-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .icon-svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
            opacity: 0.8;
        }

        @media (max-width: 600px) {
            body { padding: 10px; }
            .lecture-item { flex-direction: column; align-items: flex-start; gap: 10px; }
            .day-col { width: 90px; }
            /* في الجوال نضع شارة انتهت في الأعلى */
            .lecture-past .ended-badge {
                position: absolute;
                top: 10px;
                left: 10px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-actions">
        <h2>
            <svg class="icon-svg" style="width:28px; height:28px; color:var(--accent);" viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11z"/></svg>
            الجدول الدراسي
        </h2>
    </div>

    <table id="schedule-table">
        <thead>
            <tr>
                <th>اليوم</th>
                <th>المحاضرات</th>
            </tr>
        </thead>
        <tbody id="table-body">
            </tbody>
    </table>
</div>

<script>
    // 1. البيانات
    const courses = [
        { code: "ADEN 1110", name: "اللغة الإنجليزية 1", color: "#3b82f6", lecturer: "د. جلال حابس الربيع" },
        { code: "ADIT 1110", name: "مقدمة تقنية المعلومات", color: "#06b6d4", lecturer: "د. محمود عبدالمنعم" },
        { code: "ADCY 1111", name: "أساسيات الشبكات", color: "#10b981", lecturer: "د. عبدالعزيز الدمراني" },
        { code: "ADCY 1112", name: "أمن سيبراني", color: "#f43f5e", lecturer: "د. عمرو عبدالواحد" },
        { code: "ADCY 1113", name: "رياضيات الحاسب", color: "#8b5cf6", lecturer: "د. أسامة رزق شاهين" }
    ];

    const scheduleData = [
        { dayOffset: 0, dayName: "الأحد", lectures: [{ cIdx: 1, s: "15:00", e: "16:50" }, { cIdx: 2, s: "17:00", e: "17:50" }, { cIdx: 0, s: "18:00", e: "19:50" }] },
        { dayOffset: 1, dayName: "الإثنين", lectures: [{ cIdx: 3, s: "15:00", e: "16:50" }, { cIdx: 4, s: "17:00", e: "18:50" }] },
        { dayOffset: 2, dayName: "الثلاثاء", lectures: [{ cIdx: 1, s: "15:00", e: "15:50" }, { cIdx: 2, s: "16:00", e: "17:50" }] },
        { dayOffset: 3, dayName: "الأربعاء", lectures: [{ cIdx: 3, s: "15:00", e: "15:50" }, { cIdx: 4, s: "16:00", e: "16:50" }] },
        { dayOffset: 4, dayName: "الخميس", lectures: [{ cIdx: 0, s: "15:00", e: "15:50" }] }
    ];

    // 2. دالة حساب الأحد
    function getSundayDate() {
        const d = new Date();
        const day = d.getDay();
        const diff = d.getDate() - day; 
        return new Date(d.setDate(diff));
    }

    // 3. بناء الجدول
    const tableBody = document.getElementById('table-body');
    const sunday = getSundayDate();

    scheduleData.forEach((day) => {
        let currentDayDate = new Date(sunday);
        currentDayDate.setDate(sunday.getDate() + day.dayOffset);
        
        const tr = document.createElement('tr');

        // عمود اليوم
        const dayTd = document.createElement('td');
        dayTd.className = 'day-col';
        dayTd.innerHTML = `
            <div>${day.dayName}</div>
            <div class="date-sub">${currentDayDate.toLocaleDateString('en-GB')}</div>
            <button onclick='addToCalendar(${JSON.stringify(day.lectures)}, ${day.dayOffset})' class="btn-add">
                <svg class="icon-svg" style="width:12px; height:12px;" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                تقويم
            </button>
        `;
        tr.appendChild(dayTd);

        // عمود المحاضرات
        const lecTd = document.createElement('td');
        if(day.lectures.length === 0) {
            lecTd.innerHTML = '<span style="color:#666">لا توجد محاضرات</span>';
        } else {
            day.lectures.forEach(lec => {
                const c = courses[lec.cIdx];
                const div = document.createElement('div');
                const now = new Date();
                
                // حساب وقت انتهاء المحاضرة
                let lecEnd = new Date(currentDayDate);
                let [eh, em] = lec.e.split(':');
                lecEnd.setHours(parseInt(eh), parseInt(em), 0);

                // التحقق: هل انتهت؟
                const isFinished = now > lecEnd;
                
                // تحديد الكلاس
                div.className = isFinished ? 'lecture-item lecture-past' : 'lecture-item';
                div.style.borderRightColor = isFinished ? '' : c.color; // إزالة اللون إذا انتهت

                const formatTime = (t) => {
                    let [h, m] = t.split(':'); h=parseInt(h);
                    let ampm = h>=12 ? 'م' : 'ص'; h=h%12||12;
                    return `${h}:${m} ${ampm}`;
                };

                // محتوى البطاقة (نضيف شارة "انتهت" إذا كانت منتهية، أو مكان الدوام إذا لا)
                const statusHTML = isFinished 
                    ? `<div class="ended-badge">
                        <svg class="icon-svg" style="width:12px;height:12px" viewBox="0 0 24 24"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/></svg>
                        انتهت
                       </div>`
                    : `<div style="font-size:0.8rem; color:var(--accent); margin-top:6px; display:flex; align-items:center; gap:5px;">
                        <svg class="icon-svg" style="width:14px; height:14px;" viewBox="0 0 24 24"><path d="M20 18c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2H0v2h24v-2h-4zM4 6h16v10H4V6z"/></svg>
                        عن بعد - Blackboard
                       </div>`;

                div.innerHTML = `
                    <div class="lecture-info">
                        <h4>${c.name} <span style="font-size:0.8em; color:${isFinished ? '#666' : c.color}">(${c.code})</span></h4>
                        <div class="lecture-meta">
                            <div class="meta-row">
                                <svg class="icon-svg" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                                <span>${c.lecturer}</span>
                            </div>
                            <div class="meta-row">
                                <svg class="icon-svg" viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
                                <span>${formatTime(lec.s)} - ${formatTime(lec.e)}</span>
                            </div>
                        </div>
                        ${statusHTML}
                    </div>
                `;
                lecTd.appendChild(div);
            });
        }
        tr.appendChild(lecTd);
        tableBody.appendChild(tr);
    });

    // 4. إضافة للتقويم
    function addToCalendar(lectures, dayOffset) {
        let targetDate = new Date(sunday);
        targetDate.setDate(sunday.getDate() + dayOffset);
        
        const now = new Date();
        
        let icsContent = "BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//MySchedule//AR\nCALSCALE:GREGORIAN\nMETHOD:PUBLISH\n";
        let addedCount = 0;

        lectures.forEach(lec => {
            const course = courses[lec.cIdx];
            
            let startDt = new Date(targetDate);
            let [sh, sm] = lec.s.split(':');
            startDt.setHours(parseInt(sh), parseInt(sm), 0);

            let endDt = new Date(targetDate);
            let [eh, em] = lec.e.split(':');
            endDt.setHours(parseInt(eh), parseInt(em), 0);

            if (now > endDt) return; // تجاهل المنتهي

            addedCount++;
            
            let summary = course.name;
            let description = `المحاضر: ${course.lecturer}`;
            
            if (now >= startDt && now <= endDt) {
                summary = `[جارية الآن] ${course.name}`;
            }

            const formatICS = (d) => d.toISOString().replace(/-|:|\.\d+/g, '').substring(0, 15) + 'Z';

            icsContent += "BEGIN:VEVENT\n";
            icsContent += `DTSTART:${formatICS(startDt)}\n`;
            icsContent += `DTEND:${formatICS(endDt)}\n`;
            icsContent += `SUMMARY:${summary}\n`;
            icsContent += `DESCRIPTION:${description}\n`;
            icsContent += "LOCATION:Blackboard - عن بعد\n";
            icsContent += `UID:${Date.now()}_${lec.cIdx}@myschedule\n`;
            icsContent += "END:VEVENT\n";
        });

        icsContent += "END:VCALENDAR";

        if (addedCount === 0) {
            alert("جميع محاضرات هذا اليوم انتهت! 🏁");
            return;
        }

        const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `schedule_${targetDate.toISOString().slice(0,10)}.ics`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة الأمن السيبراني</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d1117">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2092/2092204.png">
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/2092/2092204.png">
    
    <style>
        :root {
            --bg: #0d1117; --card-bg: #161b22; --border: #30363d; --text: #e6edf3;
            --accent: #58a6ff; --success: #238636; --danger: #da3633; --warning: #d29922;
            --muted: #8b949e; --telegram: #229ED9; --today-bg: rgba(88, 166, 255, 0.08);
            --today-border: #58a6ff;
        }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; }
        .ticker-wrap { width: 100%; background: rgba(210, 153, 34, 0.1); border-bottom: 1px solid var(--warning); overflow: hidden; height: 40px; display: flex; align-items: center; position: relative; z-index: 10; }
        .ticker { display: inline-block; white-space: nowrap; padding-right: 100%; animation: ticker 30s linear infinite; color: #e6edf3; font-size: 0.85rem; line-height: 40px; }
        .ticker strong { color: var(--warning); }
        .ticker span { color: var(--telegram); font-weight: bold; }
        @keyframes ticker { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(100%, 0, 0); } }
        .container { width: 90%; max-width: 800px; padding: 20px 0; padding-bottom: 80px; }
        .smart-radar { background: linear-gradient(135deg, rgba(88, 166, 255, 0.1), rgba(35, 134, 54, 0.1)); border: 1px solid var(--accent); border-radius: 12px; padding: 15px; margin-bottom: 25px; text-align: center; position: relative; overflow: hidden; display: none; }
        .radar-status { font-size: 0.8rem; color: var(--accent); margin-bottom: 5px; }
        .radar-course { font-size: 1.3rem; font-weight: bold; margin: 5px 0; }
        .radar-time { font-size: 1rem; background: rgba(0,0,0,0.3); display: inline-block; padding: 2px 10px; border-radius: 15px; margin-top: 5px; }
        .radar-countdown { font-size: 0.85rem; color: var(--muted); margin-top: 5px; }
        .radar-pulse { position: absolute; top: 10px; left: 10px; width: 8px; height: 8px; background: var(--success); border-radius: 50%; animation: pulse-green 2s infinite; }
        @keyframes pulse-green { 0% { box-shadow: 0 0 0 0 rgba(35, 134, 54, 0.7); } 70% { box-shadow: 0 0 0 6px rgba(35, 134, 54, 0); } 100% { box-shadow: 0 0 0 0 rgba(35, 134, 54, 0); } }
        .header-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; gap: 10px; }
        .header-title { display: flex; align-items: center; gap: 10px; font-size: 1.3rem; margin: 0; }
        .header-buttons { display: flex; gap: 8px; }
        .btn-action { border: none; padding: 6px 12px; border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 0.8rem; display: flex; align-items: center; gap: 6px; text-decoration: none; color: white; transition: 0.2s; }
        .btn-telegram { background: var(--telegram); }
        .btn-telegram.disabled { background: #2f363d; color: #8b949e; cursor: help; }
        .btn-notify { background: var(--card-bg); border: 1px solid var(--muted); color: var(--text); }
        .btn-notify.active { background: var(--success); border-color: var(--success); }
        .btn-install { background: var(--accent); display: none; }
        table { width: 100%; border-collapse: separate; border-spacing: 0 10px; }
        tr { background: var(--card-bg); }
        td { padding: 15px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); vertical-align: top; }
        td:first-child { border-right: 1px solid var(--border); border-left: 1px solid var(--border); border-top-right-radius: 8px; border-bottom-right-radius: 8px; }
        td:last-child { border-left: 1px solid var(--border); border-top-left-radius: 8px; border-bottom-left-radius: 8px; }
        tr.today-row td { background: var(--today-bg); border-color: var(--today-border); }
        tr.today-row td:first-child { border-right: 3px solid var(--today-border); }
        .today-badge { font-size: 0.7rem; background: var(--accent); color: white; padding: 2px 6px; border-radius: 4px; margin-top: 5px; display: inline-block; }
        .day-col { width: 90px; font-weight: bold; color: var(--accent); text-align: center; vertical-align: middle; }
        .date-sub { font-size: 0.7rem; color: var(--muted); margin-bottom: 8px; font-family: monospace; direction: ltr; }
        .lecture-item { background: rgba(255,255,255,0.03); border: 1px solid var(--border); padding: 10px; margin-bottom: 8px; border-radius: 6px; border-right: 3px solid transparent; display: flex; justify-content: space-between; align-items: center; position: relative; overflow: hidden; }
        .lecture-past { opacity: 0.6; filter: grayscale(1); background: #090c10; border-right-color: #30363d !important; }
        .ended-badge { background: #21262d; color: #8b949e; border: 1px solid #30363d; font-size: 0.65rem; padding: 2px 8px; border-radius: 20px; }
        .lecture-info h4 { margin: 0 0 5px 0; font-size: 0.95rem; }
        .lecture-meta { font-size: 0.8rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 10px; }
        .meta-row { display: flex; align-items: center; gap: 4px; }
        .icon-svg { width: 14px; height: 14px; fill: currentColor; opacity: 0.8; }
        .progress-bar-bg { position: absolute; bottom: 0; left: 0; width: 100%; height: 3px; background: transparent; }
        .progress-bar-fill { height: 100%; background: var(--danger); width: 0%; transition: width 1s linear; }
    </style>
</head>
<body>

<div class="ticker-wrap">
    <div class="ticker">
        <strong>⚠️ إخلاء مسؤولية:</strong> هذا التطبيق مبادرة طلابية تطوعية ولا يتبع لأي جهة رسمية. في حال وجود تحديث، الرجوع دائمًا إلى <span>قناة التلجرام (الرابط قريباً)</span> أو المصادر الرسمية.
    </div>
</div>

<div class="container">
    <div id="smart-radar" class="smart-radar">
        <div class="radar-pulse"></div>
        <div class="radar-status" id="radar-status">...</div>
        <h3 class="radar-course" id="radar-course">...</h3>
        <div class="radar-time" id="radar-time">--:--</div>
        <div class="radar-countdown" id="radar-countdown">--</div>
    </div>

    <div class="header-actions">
        <h2 class="header-title">
            <svg class="icon-svg" style="width:24px; height:24px; color:var(--accent);" viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/></svg>
            الجدول الدراسي
        </h2>
        <div class="header-buttons">
            <a id="telegram-btn" href="#" class="btn-action btn-telegram">قناة التلجرام</a>
            <button id="notify-btn" class="btn-action btn-notify" onclick="toggleNotifications()">تنبيهات</button>
            <button id="install-btn" class="btn-action btn-install">📲 تثبيت</button>
        </div>
    </div>
    <table id="schedule-table"><tbody id="table-body"></tbody></table>
</div>

<script>
    // 1. الإعدادات
    const telegramLink = ""; // اتركه فارغاً حتى يتوفر الرابط
    const telegramBtn = document.getElementById('telegram-btn');
    if (!telegramLink) { 
        telegramBtn.onclick = () => alert("الرابط سيتم إضافته قريباً حال توفره.");
        telegramBtn.classList.add('disabled');
    } else {
        telegramBtn.href = telegramLink;
    }

    const courses = [
        { code: "ADEN 1110", name: "اللغة الإنجليزية 1", color: "#3b82f6", lecturer: "د. جلال حابس الربيع" },
        { code: "ADIT 1110", name: "مقدمة تقنية المعلومات", color: "#06b6d4", lecturer: "د. محمود عبدالمنعم" },
        { code: "ADCY 1111", name: "أساسيات الشبكات", color: "#10b981", lecturer: "د. عبدالعزيز الدمراني" },
        { code: "ADCY 1112", name: "أمن سيبراني", color: "#f43f5e", lecturer: "د. عمرو عبدالواحد" },
        { code: "ADCY 1113", name: "رياضيات الحاسب", color: "#8b5cf6", lecturer: "د. أسامة رزق شاهين" }
    ];

    const scheduleData = [
        { dayOffset: 0, dayName: "الأحد", lectures: [{ cIdx: 1, s: "15:00", e: "16:50" }, { cIdx: 2, s: "17:00", e: "17:50" }, { cIdx: 0, s: "18:00", e: "19:50" }] },
        { dayOffset: 1, dayName: "الإثنين", lectures: [{ cIdx: 3, s: "15:00", e: "16:50" }, { cIdx: 4, s: "17:00", e: "18:50" }] },
        { dayOffset: 2, dayName: "الثلاثاء", lectures: [{ cIdx: 1, s: "15:00", e: "15:50" }, { cIdx: 2, s: "16:00", e: "17:50" }] },
        { dayOffset: 3, dayName: "الأربعاء", lectures: [{ cIdx: 3, s: "15:00", e: "15:50" }, { cIdx: 4, s: "16:00", e: "16:50" }] },
        { dayOffset: 4, dayName: "الخميس", lectures: [{ cIdx: 0, s: "15:00", e: "15:50" }] }
    ];

    function getSundayDate() {
        const d = new Date(); const day = d.getDay();
        const diff = d.getDate() - day; return new Date(d.setDate(diff));
    }

    const tableBody = document.getElementById('table-body');
    const sunday = getSundayDate();

    // 2. دالة بناء الجدول
    function renderSchedule() {
        tableBody.innerHTML = ''; const now = new Date(); const todayDateString = now.toDateString();
        let todayElementId = null;
        scheduleData.forEach((day, index) => {
            let currentDayDate = new Date(sunday); currentDayDate.setDate(sunday.getDate() + day.dayOffset);
            const isToday = currentDayDate.toDateString() === todayDateString;
            const rowId = `day-row-${index}`; if(isToday) todayElementId = rowId;
            let endOfDay = new Date(currentDayDate); endOfDay.setHours(23, 59, 59);
            const isPastDay = now > endOfDay;
            
            const tr = document.createElement('tr'); tr.className = isToday ? 'today-row' : ''; tr.id = rowId;
            const dayTd = document.createElement('td'); dayTd.className = 'day-col';
            dayTd.innerHTML = `<div>${day.dayName}</div>${isToday ? '<div class="today-badge">اليوم</div>' : ''}<div class="date-sub">${currentDayDate.toLocaleDateString('en-GB')}</div>`;
            tr.appendChild(dayTd);
            
            const lecTd = document.createElement('td');
            if(day.lectures.length === 0) {
                 lecTd.innerHTML = '<span style="color:#666; font-size:0.9rem;">لا توجد محاضرات</span>';
            } else {
                day.lectures.forEach(lec => {
                    const c = courses[lec.cIdx]; const div = document.createElement('div');
                    let lStart = new Date(currentDayDate); let [sh, sm] = lec.s.split(':'); lStart.setHours(sh, sm, 0);
                    let lEnd = new Date(currentDayDate); let [eh, em] = lec.e.split(':'); lEnd.setHours(eh, em, 0);
                    const isFinished = now > lEnd; const isRunning = now >= lStart && now <= lEnd;
                    div.className = isFinished ? 'lecture-item lecture-past' : 'lecture-item';
                    div.style.borderRightColor = isFinished ? '' : c.color;
                    const formatTime = (t) => { let [h, m] = t.split(':'); h=parseInt(h); let ampm = h>=12 ? 'م' : 'ص'; h=h%12||12; return `${h}:${m} ${ampm}`; };
                    div.innerHTML = `<div class="lecture-info"><h4>${c.name} <span style="font-size:0.8em; color:${isFinished ? '#666' : c.color}">(${c.code})</span></h4><div class="lecture-meta"><div class="meta-row">👨‍🏫 ${c.lecturer}</div><div class="meta-row">⏰ ${formatTime(lec.s)} - ${formatTime(lec.e)}</div></div>${isFinished ? '<div class="ended-badge">انتهت</div>' : '<div style="font-size:0.75rem; color:var(--accent); margin-top:6px;">عن بعد</div>'}</div>`;
                    if(isRunning) { let p = ((now - lStart) / (lEnd - lStart)) * 100; div.innerHTML += `<div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${p}%"></div></div>`; }
                    lecTd.appendChild(div);
                });
            }
            tr.appendChild(lecTd); tableBody.appendChild(tr);
        });
        if (todayElementId) { setTimeout(() => { const el = document.getElementById(todayElementId); if(el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 500); }
    }

    // 3. دالة الرادار الذكية (المصححة)
    function updateRadar() {
        const radarEl = document.getElementById('smart-radar'); const now = new Date(); const dayIdx = now.getDay();
        let found = null; let status = "";

        // البحث في محاضرات اليوم الحالي (المتبقية)
        let todayData = scheduleData.find(d => d.dayOffset === dayIdx);
        if (todayData) {
            for (let lec of todayData.lectures) {
                let s = new Date(now); let [sh, sm] = lec.s.split(':'); s.setHours(sh, sm, 0);
                let e = new Date(now); let [eh, em] = lec.e.split(':'); e.setHours(eh, em, 0);
                if (now >= s && now <= e) { found = { ...lec, tObj: e }; status = "🔴 جارية الآن"; break; }
                else if (now < s) { found = { ...lec, tObj: s }; status = "المحاضرة القادمة (اليوم)"; break; }
            }
        }

        // إذا لم نجد شيئاً اليوم، ابحث في الأيام القادمة بالترتيب
        if (!found) {
            for (let i = 1; i <= 7; i++) {
                let nextIdx = (dayIdx + i) % 7;
                // إذا كان يوم جمعة (5) أو سبت (6) لا يوجد في الجدول، سنتخطاه تلقائياً لأنه غير موجود في scheduleData
                let nextDayData = scheduleData.find(d => d.dayOffset === nextIdx);
                
                if (nextDayData && nextDayData.lectures.length > 0) {
                    // وجدنا أول يوم دوام قادم
                    let firstLec = nextDayData.lectures[0];
                    // يجب حساب تاريخ المحاضرة القادمة بدقة للعداد التنازلي
                    let nextDate = new Date(now);
                    nextDate.setDate(now.getDate() + i);
                    let [sh, sm] = firstLec.s.split(':');
                    nextDate.setHours(sh, sm, 0);
                    
                    found = { ...firstLec, tObj: nextDate };
                    status = `المحاضرة القادمة (${nextDayData.dayName})`;
                    break;
                }
            }
        }

        if (found) {
            radarEl.style.display = 'block'; document.getElementById('radar-status').innerText = status;
            document.getElementById('radar-course').innerText = courses[found.cIdx].name;
            const ft = (t) => { let [h, m] = t.split(':'); h=parseInt(h); let ap = h>=12 ? 'م' : 'ص'; h=h%12||12; return `${h}:${m} ${ap}`; };
            document.getElementById('radar-time').innerText = `${ft(found.s)} - ${ft(found.e)}`;
            if (found.tObj) {
                let diff = found.tObj - now;
                if (diff > 0) {
                    let d = Math.floor(diff / (1000 * 60 * 60 * 24));
                    let h = Math.floor((diff / (1000 * 60 * 60)) % 24);
                    let m = Math.floor((diff / 1000 / 60) % 60);
                    let timeStr = "";
                    if(d > 0) timeStr += `${d}ي و `;
                    timeStr += `${h}س و ${m}د`;
                    
                    document.getElementById('radar-countdown').innerText = status.includes("جارية") ? `تنتهي خلال ${timeStr}` : `تبدأ خلال ${timeStr}`;
                } else {
                    document.getElementById('radar-countdown').innerText = "الآن";
                }
            }
        } else { radarEl.style.display = 'none'; }
    }

    // PWA & Service Worker
    if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js'); }); }
    let deferredPrompt; const installBtn = document.getElementById('install-btn');
    window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; installBtn.style.display = 'block';
        installBtn.addEventListener('click', () => { installBtn.style.display = 'none'; deferredPrompt.prompt(); deferredPrompt.userChoice.then((choiceResult) => { deferredPrompt = null; }); });
    });

    renderSchedule(); updateRadar(); setInterval(updateRadar, 60000); setInterval(renderSchedule, 60000);
    // Notification Logic (Simplified for space)
    function toggleNotifications() { Notification.requestPermission().then(p => { if(p==="granted") new Notification("تم تفعيل التنبيهات"); }); }
</script>
</body>
</html>

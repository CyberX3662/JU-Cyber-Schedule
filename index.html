<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة الأمن السيبراني</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d1117">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <style>
        :root {
            --bg: #0d1117;
            --card-bg: #161b22;
            --border: #30363d;
            --text: #e6edf3;
            --accent: #58a6ff;
            --success: #238636;
            --danger: #da3633;
            --warning: #d29922;
            --muted: #8b949e;
            --today-bg: rgba(88, 166, 255, 0.08); /* لون خلفية اليوم الحالي */
            --today-border: #58a6ff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* شريط التنبيهات */
        .ticker-wrap {
            width: 100%;
            background: rgba(210, 153, 34, 0.15);
            border-bottom: 1px solid var(--warning);
            overflow: hidden;
            height: 35px;
            display: flex;
            align-items: center;
        }
        .ticker {
            display: inline-block;
            white-space: nowrap;
            padding-right: 100%;
            animation: ticker 25s linear infinite;
            color: var(--warning);
            font-weight: bold;
            font-size: 0.85rem;
        }
        @keyframes ticker {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(100%, 0, 0); }
        }

        .container {
            width: 90%;
            max-width: 800px;
            padding: 20px 0;
            padding-bottom: 80px; /* مسافة للأسفل */
        }

        /* الرادار */
        .smart-radar {
            background: linear-gradient(135deg, rgba(88, 166, 255, 0.1), rgba(35, 134, 54, 0.1));
            border: 1px solid var(--accent);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 25px;
            text-align: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            display: none;
        }
        .radar-status { font-size: 0.8rem; color: var(--accent); margin-bottom: 5px; text-transform: uppercase; }
        .radar-course { font-size: 1.3rem; font-weight: bold; margin: 5px 0; }
        .radar-time { font-size: 1rem; background: rgba(0,0,0,0.3); display: inline-block; padding: 2px 10px; border-radius: 15px; margin-top: 5px; }
        .radar-countdown { font-size: 0.85rem; color: var(--muted); margin-top: 5px; }
        .radar-pulse {
            position: absolute; top: 10px; left: 10px; width: 8px; height: 8px;
            background: var(--success); border-radius: 50%;
            animation: pulse-green 2s infinite;
        }
        @keyframes pulse-green {
            0% { box-shadow: 0 0 0 0 rgba(35, 134, 54, 0.7); }
            70% { box-shadow: 0 0 0 6px rgba(35, 134, 54, 0); }
            100% { box-shadow: 0 0 0 0 rgba(35, 134, 54, 0); }
        }

        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        h2 { margin: 0; display: flex; align-items: center; gap: 10px; font-size: 1.4rem; }
        
        .btn-install {
            background: var(--accent); color: #fff; border: none; padding: 6px 14px;
            border-radius: 20px; font-weight: bold; cursor: pointer; display: none; font-size: 0.8rem;
        }

        /* الجدول */
        table { width: 100%; border-collapse: separate; border-spacing: 0 10px; /* مسافة بين الصفوف */ }
        
        /* تصميم الصفوف */
        tr {
            background: var(--card-bg);
        }
        
        td {
            padding: 15px;
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            vertical-align: top;
        }
        td:first-child { 
            border-right: 1px solid var(--border); 
            border-left: 1px solid var(--border);
            border-top-right-radius: 8px;
            border-bottom-right-radius: 8px;
        }
        td:last-child { 
            border-left: 1px solid var(--border);
            border-top-left-radius: 8px;
            border-bottom-left-radius: 8px;
        }

        /* 🌟 تمييز اليوم الحالي 🌟 */
        tr.today-row td {
            background: var(--today-bg);
            border-color: var(--today-border);
            position: relative;
        }
        tr.today-row td:first-child {
            border-right: 3px solid var(--today-border);
        }
        .today-badge {
            font-size: 0.7rem;
            background: var(--accent);
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            margin-top: 5px;
            display: inline-block;
        }

        .day-col { 
            width: 90px; font-weight: bold; color: var(--accent); 
            text-align: center; vertical-align: middle; 
        }
        .date-sub { font-size: 0.7rem; color: var(--muted); margin-bottom: 8px; font-family: monospace; direction: ltr; }

        .btn-add { 
            background: rgba(35, 134, 54, 0.1); color: var(--success); border: 1px solid var(--border); 
            font-size: 0.75rem; padding: 4px 8px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 4px; margin: 0 auto;
        }
        .btn-add:hover { background: rgba(35, 134, 54, 0.2); border-color: var(--success); }
        .btn-disabled { background: transparent; color: var(--muted); border-color: transparent; cursor: default; }

        /* بطاقات المحاضرات */
        .lecture-item { 
            background: rgba(255,255,255,0.03); border: 1px solid var(--border); padding: 10px; margin-bottom: 8px; 
            border-radius: 6px; border-right: 3px solid transparent; display: flex; justify-content: space-between; align-items: center; transition:0.3s;
            position: relative;
            overflow: hidden;
        }
        .lecture-past { opacity: 0.6; filter: grayscale(1); background: #090c10; border-right-color: #30363d !important; }
        
        .ended-badge { background: #21262d; color: #8b949e; border: 1px solid #30363d; font-size: 0.65rem; padding: 2px 8px; border-radius: 20px; }
        
        .lecture-info h4 { margin: 0 0 5px 0; font-size: 0.95rem; }
        .lecture-meta { font-size: 0.8rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 10px; }
        .meta-row { display: flex; align-items: center; gap: 4px; }
        .icon-svg { width: 14px; height: 14px; fill: currentColor; opacity: 0.8; }

        /* شريط التقدم داخل المحاضرة */
        .progress-bar-bg {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 3px; background: transparent;
        }
        .progress-bar-fill {
            height: 100%; background: var(--danger); width: 0%; transition: width 1s linear;
        }

        @media (max-width: 600px) {
            .container { width: 95%; }
            .lecture-item { flex-direction: column; align-items: flex-start; gap: 8px; }
            .day-col { width: 80px; font-size: 0.9rem; }
            table { border-spacing: 0 5px; }
        }
    </style>
</head>
<body>

<div class="ticker-wrap">
    <div class="ticker">
        📢 تنبيه: تأكد من مراجعة البلاك بورد بشكل يومي - التطبيق يعمل الآن بدون إنترنت - تم تحديث المواعيد للفصل الحالي.
    </div>
</div>

<div class="container">
    
    <div id="smart-radar" class="smart-radar">
        <div class="radar-pulse"></div>
        <div class="radar-status" id="radar-status">المحاضرة القادمة</div>
        <h3 class="radar-course" id="radar-course">جاري التحميل...</h3>
        <div class="radar-time" id="radar-time">--:--</div>
        <div class="radar-countdown" id="radar-countdown">--</div>
    </div>

    <div class="header-actions">
        <h2>
            <svg class="icon-svg" style="width:24px; height:24px; color:var(--accent);" viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11z"/></svg>
            الجدول الدراسي
        </h2>
        <button id="install-btn" class="btn-install">📲 تثبيت</button>
    </div>

    <table id="schedule-table">
        <tbody id="table-body"></tbody>
    </table>
</div>

<script>
    const courses = [
        { code: "ADEN 1110", name: "اللغة الإنجليزية 1", color: "#3b82f6", lecturer: "د. جلال حابس الربيع" },
        { code: "ADIT 1110", name: "مقدمة تقنية المعلومات", color: "#06b6d4", lecturer: "د. محمود عبدالمنعم" },
        { code: "ADCY 1111", name: "أساسيات الشبكات", color: "#10b981", lecturer: "د. عبدالعزيز الدمراني" },
        { code: "ADCY 1112", name: "أمن سيبراني", color: "#f43f5e", lecturer: "د. عمرو عبدالواحد" },
        { code: "ADCY 1113", name: "رياضيات الحاسب", color: "#8b5cf6", lecturer: "د. أسامة رزق شاهين" }
    ];

    const scheduleData = [
        { dayOffset: 0, dayName: "الأحد", lectures: [{ cIdx: 1, s: "15:00", e: "16:50" }, { cIdx: 2, s: "17:00", e: "17:50" }, { cIdx: 0, s: "18:00", e: "19:50" }] },
        { dayOffset: 1, dayName: "الإثنين", lectures: [{ cIdx: 3, s: "15:00", e: "16:50" }, { cIdx: 4, s: "17:00", e: "18:50" }] },
        { dayOffset: 2, dayName: "الثلاثاء", lectures: [{ cIdx: 1, s: "15:00", e: "15:50" }, { cIdx: 2, s: "16:00", e: "17:50" }] },
        { dayOffset: 3, dayName: "الأربعاء", lectures: [{ cIdx: 3, s: "15:00", e: "15:50" }, { cIdx: 4, s: "16:00", e: "16:50" }] },
        { dayOffset: 4, dayName: "الخميس", lectures: [{ cIdx: 0, s: "15:00", e: "15:50" }] }
    ];

    function getSundayDate() {
        const d = new Date();
        const day = d.getDay();
        const diff = d.getDate() - day; 
        return new Date(d.setDate(diff));
    }

    const tableBody = document.getElementById('table-body');
    const sunday = getSundayDate();

    function renderSchedule() {
        tableBody.innerHTML = '';
        const now = new Date();
        const todayDateString = now.toDateString(); // لمقارنة التواريخ فقط

        // متغير لتخزين عنصر اليوم الحالي للتمرير إليه
        let todayElementId = null;

        scheduleData.forEach((day, index) => {
            let currentDayDate = new Date(sunday);
            currentDayDate.setDate(sunday.getDate() + day.dayOffset);
            
            // التحقق من اليوم الحالي
            const isToday = currentDayDate.toDateString() === todayDateString;
            const rowId = `day-row-${index}`;
            if(isToday) todayElementId = rowId;

            let endOfDay = new Date(currentDayDate);
            endOfDay.setHours(23, 59, 59);
            const isPastDay = now > endOfDay;

            let btnClass = isPastDay ? 'btn-add btn-disabled' : 'btn-add';
            let btnText = isPastDay ? 'انتهى' : 'تقويم';
            let btnAction = isPastDay ? '' : `onclick='addToCalendar(${JSON.stringify(day.lectures)}, ${day.dayOffset})'`;

            // إضافة كلاس خاص إذا كان اليوم هو اليوم الحالي
            const rowClass = isToday ? 'today-row' : '';
            const badgeHTML = isToday ? '<div class="today-badge">اليوم</div>' : '';

            const tr = document.createElement('tr');
            tr.className = rowClass;
            tr.id = rowId;
            
            // عمود اليوم
            const dayTd = document.createElement('td');
            dayTd.className = 'day-col';
            dayTd.innerHTML = `
                <div>${day.dayName}</div>
                ${badgeHTML}
                <div class="date-sub">${currentDayDate.toLocaleDateString('en-GB')}</div>
                <button ${btnAction} class="${btnClass}">
                    ${isPastDay ? '' : '<svg class="icon-svg" style="width:10px;height:10px;" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>'}
                    ${btnText}
                </button>
            `;
            tr.appendChild(dayTd);

            // عمود المحاضرات
            const lecTd = document.createElement('td');
            if(day.lectures.length === 0) {
                lecTd.innerHTML = '<span style="color:#666; font-size:0.9rem;">لا توجد محاضرات</span>';
            } else {
                day.lectures.forEach(lec => {
                    const c = courses[lec.cIdx];
                    const div = document.createElement('div');
                    
                    let lecStart = new Date(currentDayDate);
                    let [sh, sm] = lec.s.split(':');
                    lecStart.setHours(sh, sm, 0);

                    let lecEnd = new Date(currentDayDate);
                    let [eh, em] = lec.e.split(':');
                    lecEnd.setHours(eh, em, 0);

                    const isFinished = now > lecEnd;
                    const isRunning = now >= lecStart && now <= lecEnd;

                    div.className = isFinished ? 'lecture-item lecture-past' : 'lecture-item';
                    div.style.borderRightColor = isFinished ? '' : c.color;

                    // حساب شريط التقدم
                    let progressHTML = '';
                    if (isRunning) {
                        const totalDuration = lecEnd - lecStart;
                        const elapsed = now - lecStart;
                        const percent = Math.min(100, Math.max(0, (elapsed / totalDuration) * 100));
                        progressHTML = `<div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${percent}%"></div></div>`;
                    }

                    const formatTime = (t) => {
                        let [h, m] = t.split(':'); h=parseInt(h);
                        let ampm = h>=12 ? 'م' : 'ص'; h=h%12||12;
                        return `${h}:${m} ${ampm}`;
                    };

                    const statusHTML = isFinished 
                        ? `<div class="ended-badge">انتهت</div>`
                        : `<div style="font-size:0.75rem; color:var(--accent); margin-top:6px; display:flex; align-items:center; gap:4px;">
                            <svg class="icon-svg" style="width:12px; height:12px;" viewBox="0 0 24 24"><path d="M20 18c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2H0v2h24v-2h-4zM4 6h16v10H4V6z"/></svg>
                            عن بعد
                           </div>`;

                    div.innerHTML = `
                        <div class="lecture-info" style="width:100%">
                            <h4>${c.name} <span style="font-size:0.8em; color:${isFinished ? '#666' : c.color}">(${c.code})</span></h4>
                            <div class="lecture-meta">
                                <div class="meta-row"><span>👨‍🏫 ${c.lecturer}</span></div>
                                <div class="meta-row"><span>⏰ ${formatTime(lec.s)} - ${formatTime(lec.e)}</span></div>
                            </div>
                            ${statusHTML}
                        </div>
                        ${progressHTML}
                    `;
                    lecTd.appendChild(div);
                });
            }
            tr.appendChild(lecTd);
            tableBody.appendChild(tr);
        });

        // التمرير التلقائي لليوم الحالي
        if (todayElementId) {
            setTimeout(() => {
                const el = document.getElementById(todayElementId);
                if(el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 500); // تأخير بسيط لضمان التحميل
        }
    }

    // === منطق الرادار ===
    function updateRadar() {
        const radarEl = document.getElementById('smart-radar');
        const now = new Date();
        const currentDayIndex = now.getDay(); 
        
        let foundLecture = null;
        let status = "";
        
        let todayLectures = scheduleData.find(d => d.dayOffset === currentDayIndex)?.lectures || [];
        
        for (let lec of todayLectures) {
            let start = new Date(now);
            let [sh, sm] = lec.s.split(':');
            start.setHours(sh, sm, 0);

            let end = new Date(now);
            let [eh, em] = lec.e.split(':');
            end.setHours(eh, em, 0);

            if (now >= start && now <= end) {
                foundLecture = { ...lec, timeObj: end };
                status = "🔴 جارية الآن";
                break;
            } else if (now < start) {
                foundLecture = { ...lec, timeObj: start };
                status = "المحاضرة القادمة";
                break;
            }
        }

        if (!foundLecture) {
            let nextDayOffset = (currentDayIndex + 1) % 7; 
            if(nextDayOffset > 4) nextDayOffset = 0; 
            let nextLectures = scheduleData.find(d => d.dayOffset === nextDayOffset)?.lectures || [];
            if (nextLectures.length > 0) {
                foundLecture = { ...nextLectures[0], timeObj: null }; 
                status = "المحاضرة القادمة (غداً/الأحد)";
            }
        }

        if (foundLecture) {
            radarEl.style.display = 'block';
            const course = courses[foundLecture.cIdx];
            document.getElementById('radar-status').innerText = status;
            document.getElementById('radar-course').innerText = course.name;
            const formatTime = (t) => {
                 let [h, m] = t.split(':'); h=parseInt(h);
                 let ampm = h>=12 ? 'م' : 'ص'; h=h%12||12;
                 return `${h}:${m} ${ampm}`;
            };
            document.getElementById('radar-time').innerText = `${formatTime(foundLecture.s)} - ${formatTime(foundLecture.e)}`;

            if (foundLecture.timeObj) {
                const diff = foundLecture.timeObj - now;
                const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                if (status.includes("جارية")) {
                    document.getElementById('radar-countdown').innerText = `تنتهي خلال ${hours}س و ${minutes}د`;
                    document.getElementById('radar-status').style.color = '#da3633';
                    document.querySelector('.radar-pulse').style.background = '#da3633';
                } else {
                    document.getElementById('radar-countdown').innerText = `تبدأ خلال ${hours}س و ${minutes}د`;
                    document.getElementById('radar-status').style.color = '#58a6ff';
                    document.querySelector('.radar-pulse').style.background = '#238636';
                }
            } else {
                 document.getElementById('radar-countdown').innerText = "";
            }
        } else {
            radarEl.style.display = 'none';
        }
    }

    function addToCalendar(lectures, dayOffset) {
        let targetDate = new Date(sunday);
        targetDate.setDate(sunday.getDate() + dayOffset);
        const now = new Date();
        
        let icsContent = "BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//MySchedule//AR\nCALSCALE:GREGORIAN\nMETHOD:PUBLISH\n";
        let addedCount = 0;

        lectures.forEach(lec => {
            const course = courses[lec.cIdx];
            let startDt = new Date(targetDate);
            let [sh, sm] = lec.s.split(':');
            startDt.setHours(sh, sm, 0);
            let endDt = new Date(targetDate);
            let [eh, em] = lec.e.split(':');
            endDt.setHours(eh, em, 0);

            if (now > endDt) return;
            addedCount++;
            let summary = course.name;
            if (now >= startDt && now <= endDt) summary = `[جارية الآن] ${course.name}`;
            
            const formatICS = (d) => d.toISOString().replace(/-|:|\.\d+/g, '').substring(0, 15) + 'Z';
            icsContent += `BEGIN:VEVENT\nDTSTART:${formatICS(startDt)}\nDTEND:${formatICS(endDt)}\nSUMMARY:${summary}\nLOCATION:Blackboard\nUID:${Date.now()}_${lec.cIdx}\nEND:VEVENT\n`;
        });
        icsContent += "END:VCALENDAR";

        if (addedCount === 0) { alert("جميع المحاضرات انتهت!"); return; }
        const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `schedule.ics`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js'); });
    }

    let deferredPrompt;
    const installBtn = document.getElementById('install-btn');
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        installBtn.style.display = 'block';
        installBtn.addEventListener('click', () => {
            installBtn.style.display = 'none';
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then((choiceResult) => { deferredPrompt = null; });
        });
    });

    renderSchedule();
    updateRadar();
    setInterval(updateRadar, 60000); 
    setInterval(renderSchedule, 60000); // تحديث الجدول كل دقيقة لتحديث شريط التقدم
</script>

</body>
</html>
